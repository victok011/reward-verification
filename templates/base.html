<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Silencio Raffle Verification{% endblock %}</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1c2330;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --accent-2: #3fb950;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Layout */
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 12px;
      padding: 0 8px;
    }
    .sidebar a {
      display: block;
      color: var(--text);
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 14px;
      margin-bottom: 2px;
    }
    .sidebar a:hover { background: var(--surface-2); text-decoration: none; }
    .sidebar a.active { background: var(--surface-2); color: var(--accent); }
    .main { flex: 1; padding: 32px 40px; max-width: 1100px; }
    .brand {
      font-size: 18px;
      font-weight: 700;
      padding: 0 8px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .brand a { color: var(--text); }

    /* Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: border-color .15s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { font-size: 16px; margin-bottom: 8px; }
    .card .meta { font-size: 13px; color: var(--text-dim); }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--accent-2);
      border: 1px solid var(--border);
    }

    /* Season page */
    .file-section { margin-bottom: 28px; }
    .file-section h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .file-list { list-style: none; }
    .file-list li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .file-list li:last-child { border-bottom: none; }
    .file-list a { color: var(--text); }
    .file-list a:hover { color: var(--accent); }

    /* Markdown */
    .markdown { max-width: 800px; }
    .markdown h1 { font-size: 28px; margin: 20px 0 12px; }
    .markdown h2 { font-size: 22px; margin: 20px 0 10px; }
    .markdown h3 { font-size: 18px; margin: 16px 0 8px; }
    .markdown p { margin-bottom: 12px; color: var(--text); }
    .markdown code {
      background: var(--surface-2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, monospace;
    }
    .markdown pre {
      background: var(--surface-2);
      padding: 12px;
      border-radius: var(--radius);
      overflow-x: auto;
      margin-bottom: 12px;
    }
    .markdown pre code { background: none; padding: 0; }
    .markdown table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .markdown th, .markdown td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    .markdown th { background: var(--surface-2); }
    .markdown img { max-width: 100%; border-radius: var(--radius); margin: 12px 0; }
    .markdown ul, .markdown ol { padding-left: 24px; margin-bottom: 12px; }

    /* CSV table */
    .csv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .csv-table th, .csv-table td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
      white-space: nowrap;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .csv-table th { background: var(--surface-2); position: sticky; top: 0; }
    .csv-table tr:nth-child(even) { background: var(--surface); }
    .table-wrap { overflow-x: auto; }

    /* Pagination */
    .pagination { display: flex; gap: 8px; align-items: center; margin: 20px 0; }
    .pagination a, .pagination span {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
    }
    .pagination a:hover { background: var(--surface-2); text-decoration: none; }
    .pagination .current { background: var(--accent); color: #000; border-color: var(--accent); }

    .notice {
      background: rgba(59, 185, 80, 0.1);
      border: 1px solid var(--accent-2);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      color: var(--accent-2);
    }
    .breadcrumb { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; }
    .breadcrumb a { color: var(--text-dim); }
    .breadcrumb a:hover { color: var(--accent); }

    pre.code-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, monospace;
      line-height: 1.5;
      max-height: 70vh;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="brand"><a href="/">🔇 Silencio Raffle</a></div>
      <h2>Seasons</h2>
      {% block sidebar %}
        {% for s in seasons %}
          <a href="/season/{{ s.name }}">{{ s.title }}</a>
        {% endfor %}
      {% endblock %}
    </nav>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
